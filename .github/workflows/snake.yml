name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alsyakd
          outputs: |
            github-snake.svg
            github-snake-dark.svg
          svg_out_dark: github-snake-dark.svg
          svg_out: github-snake.svg
          show_legend: false
          show_steps: true

      - name: Commit and push snake SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-snake.svg github-snake-dark.svg .nojekyll
          git diff --staged --quiet || git commit -m "chore: update snake animation"
          git push
