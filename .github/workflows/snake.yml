name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alsyakd
          outputs: |
            output/github-snake.svg
            output/github-snake-dark.svg
          svg_out_dark: output/github-snake-dark.svg
          svg_out: output/github-snake.svg
          show_legend: false
          show_steps: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          destination_dir: .
          keep_files: true
          force_orphan: false
